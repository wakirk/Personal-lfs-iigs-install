
# ==== UEFI / early console ====
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFIVAR_FS=y
CONFIG_FB_EFI=y
CONFIG_DRM=y
CONFIG_DRM_SIMPLEDRM=y

# ==== Partitioning / block ====
CONFIG_PARTITION_ADVANCED=y
CONFIG_EFI_PARTITION=y

# ==== Storage controllers (present) ====
CONFIG_BLK_DEV_NVME=y
CONFIG_NVME_CORE=y
CONFIG_ATA=y
CONFIG_SATA_AHCI=y

# ==== Root filesystem & device nodes ====
CONFIG_EXT4_FS=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y

# ==== USB host / storage / input ====
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PCI=y
CONFIG_USB_STORAGE=y
CONFIG_HID=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y

# ==== PS/2 fallback ====
CONFIG_SERIO=y
CONFIG_SERIO_I8042=y
CONFIG_KEYBOARD_ATKBD=y

# ==== Graphics seen ====
CONFIG_DRM_I915=y
CONFIG_DRM_NOUVEAU=y

# ==== Networking seen ====
CONFIG_NET=y
CONFIG_PACKET=y
CONFIG_INET=y
CONFIG_IPV6=y
# Realtek PCIe GbE
CONFIG_R8169=y
# Intel Wi-Fi
CONFIG_WLAN=y
CONFIG_IWLWIFI=y
CONFIG_IWLMVM=y

# ==== Audio (HDA + codecs) ====
CONFIG_SND=y
CONFIG_SND_PCI=y
CONFIG_SND_HDA_INTEL=y
CONFIG_SND_HDA_CODEC_REALTEK=y
CONFIG_SND_HDA_CODEC_HDMI=y
CONFIG_SND_HDA_GENERIC=y

# ==== Platform / buses in use ====
CONFIG_I2C=y
CONFIG_I2C_I801=y
CONFIG_EEPROM=y
CONFIG_EE1004=y

CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y
CONFIG_SPI_INTEL_PCI=y          # intel-spi
# (Some platforms use these variants—harmless if unused)
CONFIG_MFD_INTEL_LPSS=y
CONFIG_MFD_INTEL_LPSS_PCI=y
CONFIG_INTEL_MEI=y
CONFIG_INTEL_MEI_ME=y
CONFIG_INTEL_PCH_THERMAL=y

# ==== Bluetooth seen ====
CONFIG_BT=y
CONFIG_BT_BREDR=y
CONFIG_BT_HCIBTUSB=y

# ==== Misc platform helpers ====
CONFIG_ACPI_WMI=y
CONFIG_WMI_BMOF=y
CONFIG_WATCHDOG=y
CONFIG_ITCO_WDT=y

# ===== Console + framebuffer basics =====
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_TTY=y
CONFIG_FRAMEBUFFER_CONSOLE=y     # text console on fb

# ===== DRM/KMS path (preferred) =====
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_FBDEV_EMULATION=y     # exposes /dev/fb0 via DRM
CONFIG_DRM_SIMPLEDRM=y           # early console via EFI GOP

# ===== EFI framebuffer fallback =====
CONFIG_FB=y
CONFIG_FB_EFI=y                  # efifb fallback if DRM isn’t ready yet
CONFIG_FB_SIMPLE=y               # simplefb fallback (optional)

# ===== Your GPUs (built-in, from earlier) =====
CONFIG_DRM_I915=y
CONFIG_DRM_NOUVEAU=y

# ===== Input for userspace on the console =====
CONFIG_INPUT_EVDEV=y             # SDL/evdev input without X
CONFIG_HIDRAW=y                  # optional: raw HID access if needed


# Samsung 990 Pro 2TB Type 2280 PCIe M.2 Drive for Selected Boards 149.00 1 149.00
# 32GB DDR4 3200 SODIMM only for selected boards 65.00 1 65.00
# 32GB DDR4 3200 SODIMM only for selected boards 65.00 1 65.00
# Samsung 870 EVO 2TB 2.5in SATA SSD 128.00 1 128.00
# C64x Retro Keyboard Chassis - Original Beige 169.00 1 169.00
# C64x Ultimate System with Intel i9-9880H, 4GB GTX1650, AC Adapter 649.00 1 649.00
# CARRIAGE 


# Mount the EFI System Partition or FAT sticks without modules (optional)
CONFIG_FAT_FS=y
CONFIG_MSDOS_FS=y
CONFIG_VFAT_FS=y

# Sensors you likely want on this i9-9880H + NVMe
CONFIG_HWMON=y
CONFIG_SENSORS_CORETEMP=y       # CPU temps
CONFIG_NVME_HWMON=y             # NVMe temps via hwmon (if offered in your 6.16)

# CPU frequency driver for Intel (nice for thermals/perf)
CONFIG_CPU_FREQ=y
CONFIG_X86_INTEL_PSTATE=y

# (You already had these platform bits, but listing in case)
CONFIG_INTEL_PCH_THERMAL=y
CONFIG_I2C_I801=y
CONFIG_EE1004=y                 # DDR4 SPD over SMBus

# === Filesystems (built-in) ===
CONFIG_EXT4_FS=y
CONFIG_EXT4_USE_FOR_EXT2=y

CONFIG_FAT_FS=y
CONFIG_MSDOS_FS=y          # “DOS” filesystem
CONFIG_VFAT_FS=y           # FAT32 (long filenames)

# FAT needs NLS to interpret filenames/codepages
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y  # common on FAT media
CONFIG_NLS_ISO8859_1=y     # reasonable default charset
CONFIG_FAT_DEFAULT_CODEPAGE=437
CONFIG_FAT_DEFAULT_IOCHARSET="iso8859-1"



# ==== CPU / scheduling ====
CONFIG_SMP=y                 # multi-core/HT
CONFIG_NR_CPUS=16            # fits 8C/16T, trims tables a bit
CONFIG_SCHED_MC=y            # package-level scheduling
CONFIG_SCHED_SMT=y           # hyperthreading aware

# Preemption / latency (pick one style; this selects full preempt)
CONFIG_PREEMPT=y             # low-latency kernel (good for interactive/emulators)
CONFIG_PREEMPT_COUNT=y
CONFIG_PREEMPTION=y

# Timer model / tick
CONFIG_NO_HZ_IDLE=y          # tickless when idle
CONFIG_HIGH_RES_TIMERS=y
CONFIG_HZ_1000=y             # 1000 Hz timer for smoother input/audio
# disable other HZ:
# CONFIG_HZ_250 is not set
# CONFIG_HZ_300 is not set
# CONFIG_HZ_100 is not set

# CPU power mgmt for Intel
CONFIG_CPU_FREQ=y
CONFIG_X86_INTEL_PSTATE=y
CONFIG_INTEL_IDLE=y

# ==== Memory management ====
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y   # only when userspace asks (safer for latency)
# CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS is not set

# (Optional; leave off unless you plan to use it)
# CONFIG_ZSWAP=y
# CONFIG_ZSMALLOC=y


# lfs-iigs-extras.cfg — input, console debug, clock

# Game controllers (SDL without X)
CONFIG_INPUT_JOYSTICK=y
CONFIG_INPUT_EVDEV=y          # (you already set this in fb fragment)
CONFIG_JOYSTICK_XPAD=y        # Xbox pads
CONFIG_HID_SONY=y             # DualShock/DualSense
CONFIG_HID_NINTENDO=y         # Switch Pro/Joy-Cons
CONFIG_UHID=y                 # userspace HID helpers
CONFIG_UINPUT=y               # userspace virtual input (mapping tools)

# Real-time clock so time is sane on boot
CONFIG_RTC_CLASS=y
CONFIG_RTC_HCTOSYS=y
CONFIG_RTC_HCTOSYS_DEVICE="rtc0"
CONFIG_RTC_DRV_CMOS=y

# --- lfs-iigs-delta.cfg ---

# Monolithic: turn off module support entirely
# (firmware loading still works from /lib/firmware)
# CONFIG_MODULES is not set
CONFIG_FW_LOADER=y
# CONFIG_FW_LOADER_USER_HELPER is not set

# Core pseudo filesystems (needed by lots of userspace)
CONFIG_PROC_FS=y
CONFIG_SYSFS=y

# Wi-Fi stack pieces iwlwifi needs (built-in)
CONFIG_CFG80211=y
CONFIG_MAC80211=y

# Bluetooth LE + HID over BT (for modern pads/keyboards)
CONFIG_BT_LE=y
CONFIG_BT_HIDP=y


# --- tiny delta to add ---
# Core buses
CONFIG_PCI=y
CONFIG_PCI_MSI=y

# SATA/USB storage paths need SCSI core + sd disk
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y

# Sockets & basic exec formats (some userspace quietly assumes these)
CONFIG_UNIX=y
CONFIG_BINFMT_ELF=y
CONFIG_BINFMT_SCRIPT=y

# Net device core (r8169 depends on these being on)
CONFIG_NETDEVICES=y
CONFIG_ETHERNET=y

# Wi-Fi/mac80211 crypto (for WPA/CCMP etc.)
CONFIG_CRYPTO=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_CCM=y
CONFIG_CRYPTO_GCM=y
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_SHA1=y
CONFIG_CRYPTO_MICHAEL_MIC=y    # legacy TKIP; harmless to include

